[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windcal"
version = "0.2.0"
description = "Calibration and reduction of wind tunnel balance"
dependencies = [
    "numpy>=2.0.2",
    "pandas>=2.3.0",
]
requires-python = ">=3.9"
authors = [{ name = "Joel Cranmer", email = "joel.cranmer@afacademy.af.edu" },]
readme = "README.md"
license = { text = "Proprietary" }
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "parameterized",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
